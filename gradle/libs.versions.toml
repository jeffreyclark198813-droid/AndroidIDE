[versions]
agp = "8.6.1"
gradle-tooling = "8.7"
kotlin = "2.0.21"
kotlin-coroutines = "1.9.0"
ksp = "2.0.21-1.0.25"

junit-jupiter = "5.11.0"
androidx-work = "2.10.0"
androidx-navigation = "2.8.0"

glide = "4.16.0"
retrofit = "2.11.0"
okhttp = "4.12.0"

markwon = "4.6.2"
antlr4 = "4.13.1"
tree-sitter = "4.3.1"

logback = "1.5.6"
benchmark = "1.3.0"
espresso = "3.6.1"

[libraries]

# --- Core Kotlin ---
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }

# --- Networking ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# --- Image ---
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }

# --- AndroidX (updated) ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.14.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.9.0" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version = "1.7.1" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.0" }

androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

androidx-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.1.0" }

# --- Material ---
material = { module = "com.google.android.material:material", version = "1.12.0" }

# --- Serialization / JSON ---
gson = { module = "com.google.code.gson:gson", version = "2.11.0" }

# --- Logging ---
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# --- Parsing / Tooling ---
antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr4" }
javaparser = { module = "com.github.javaparser:javaparser-symbol-solver-core", version = "3.27.0" }

# --- Editor ---
editor = { module = "io.github.Rosemoe.sora-editor:editor", version = "0.24.0" }

# --- Leak detection (debug only) ---
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version = "2.14" }

# --- Benchmark ---
benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "benchmark" }

# --- Testing ---
junit4 = { module = "junit:junit", version = "4.13.2" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.0" }

mockk = { module = "io.mockk:mockk", version = "1.13.11" }

# --- Desugaring ---
desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.2" }

# --- Removed / Deprecated ---
# - androidx-window alpha (unstable)
# - duplicate kotlin stdlib entries
# - legacy annotation processors where KSP preferred
# - hiddenapibypass (security risk, removed)
# - outdated test libs

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

benchmark = { id = "androidx.benchmark", version.ref = "benchmark" }
protobuf = { id = "com.google.protobuf", version = "0.9.5" }

maven-publish = { id = "com.vanniktech.maven.publish", version = "0.30.0" }junit", version = "1.1.5" }
tests-androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
tests-androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
tests-androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "androidx-espresso" }
tests-androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
tests-mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version = "5.2.1" }
tests-mockk = { module = "io.mockk:mockk", version = "1.13.10" }
tests-barista = { module = "com.adevinta.android:barista", version = "4.3.0" }

# Tooling
tooling-builderModel = { module = "com.android.tools.build:builder-model", version.ref = "agp-tooling" }
tooling-gradleApi = { module = "com.itsaky.androidide.gradle:gradle-tooling-api", version.ref = "gradle-tooling" }
tooling-slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.12" }

# Classpaths
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
nav-safe-args-gradle-plugin = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "androidx-navigation" }
maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish-plugin" }
androidx-benchmark-junit4 = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "benchmark-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish.base", version.ref = "maven-publish-plugin" }
gradle-publish = { id = "com.gradle.plugin-publish", version = "1.2.1" }
protobuf = { id = "com.google.protobuf", version = "0.9.4" }
benchmark = { id = "androidx.benchmark", version.ref = "benchmark" }
